// Default WTV/NDP demo-playback keybinds. Overridden by an optional
// demo_binds.cfg (create your own in your fs_homepath game folder to
// customize any of these — it execs after this file and wins).
//
// Movement (WASD/mouse-look) is NOT bound here — freecam reuses whatever
// your normal movement binds already are. Freecam entry and follow-cycling
// aren't bound here either: pressing your own +activate key (default e)
// enters freecam, and your own +attack key (default mouse1) cycles to the
// next followed player — same as live spectating. Uncomment below to also
// bind them to something else:
// bind F5 "freecam"
// bind MWHEELUP "wtvfollow next"
// bind MWHEELDOWN "wtvfollow prev"

bind END "demotimeline"
bind PGUP "ndpnextfrag"
bind PGDN "ndpprevfrag"
