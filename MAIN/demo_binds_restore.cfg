// Restores END/PGUP/PGDN when demo playback ends, undoing
// demo_binds_default.cfg's bindings for this session. Only unbinds —
// it cannot recover a custom prior binding for these keys, since the
// engine has no way to query "what was this key bound to before."
// Override by shipping your own demo_binds_restore.cfg in fs_homepath.
unbind END
unbind PGUP
unbind PGDN
